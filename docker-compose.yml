services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./apps/api
    environment:
      ENVIRONMENT: development
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qr}:${POSTGRES_PASSWORD:-qr_dev_password}@db:5432/${POSTGRES_DB:-qr_studio}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qr_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-qr_studio}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qr} -d ${POSTGRES_DB:-qr_studio}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
